<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prüfungsvorbereitung</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fb;
    --card: #ffffff;
    --border: #e4e7ee;
    --primary: #2554e8;
    --primary-dark: #1a3fb8;
    --primary-light: #eaf0ff;
    --green: #16a34a;
    --green-light: #e9f9ef;
    --red: #dc2626;
    --red-light: #fdecec;
    --text: #1c2130;
    --text-muted: #6b7280;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 0 0 60px 0;
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 26px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 0 16px;
  }
  .scorebar {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(20,30,60,0.08);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .score-main { display: flex; align-items: center; gap: 14px; }
  .score-num { font-size: 26px; font-weight: 800; color: var(--primary-dark); }
  .score-label { font-size: 12px; color: var(--text-muted); }
  .progress-outer {
    width: 140px; height: 8px; background: #eef1f7; border-radius: 6px; overflow: hidden;
  }
  .progress-inner { height: 100%; background: var(--green); width: 0%; transition: width .3s; }
  button.reset-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer;
  }
  button.reset-btn:hover { background: #f2f4f8; }

  nav.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin: 18px 0 18px 0;
    padding-bottom: 4px;
  }
  nav.tabs button {
    flex: none;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  nav.tabs button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  section.topic { display: none; }
  section.topic.active { display: block; }

  .topic-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 6px 2px 14px 2px;
  }
  .topic-header h2 { font-size: 18px; margin: 0; }
  .topic-header span { font-size: 12px; color: var(--text-muted); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(20,30,60,0.04);
  }
  .card .qtext {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .points-badge {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 7px;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s, border-color .15s;
  }
  .option:hover { background: #f7f9ff; }
  .option.correct { background: var(--green-light); border-color: var(--green); }
  .option.incorrect { background: var(--red-light); border-color: var(--red); }
  .option input { pointer-events: none; }
  .option.disabled { cursor: default; }
  .check-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  .check-btn:disabled { opacity: 0.5; cursor: default; }
  .feedback {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
  }
  .feedback.ok { background: var(--green-light); color: var(--green); }
  .feedback.bad { background: var(--red-light); color: var(--red); }

  .reveal-btn {
    background: var(--primary-light);
    color: var(--primary-dark);
    border: none;
    padding: 8px 16px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .answer-box {
    display: none;
    margin-top: 12px;
    background: #f6f8fd;
    border-left: 3px solid var(--primary);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    white-space: pre-line;
  }
  .answer-box.show { display: block; }
  ul.ans-list { margin: 4px 0 0 0; padding-inline-start: 18px; }
  ul.ans-list li { margin-bottom: 3px; }

  .diagram-wrap {
    background: #fbfcff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
  }
  .letter-badge {
    fill: var(--primary);
    cursor: pointer;
  }
  .letter-badge text { fill: #fff; font-weight: 700; font-size: 13px; }
  .diagram-legend {
    margin-top: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 16px;
  }
  .diagram-legend .row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    padding: 6px 8px;
    border-radius: 8px;
    background: #f7f9ff;
  }
  .diagram-legend .row .letter {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 12px;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .diagram-legend .row .val { display: none; font-weight: 600; }
  .diagram-legend .row.shown .val { display: inline; }
  .diagram-legend .row.shown { background: var(--green-light); }

  footer.foot {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 40px;
    direction: rtl;
  }
</style>
</head>
<body>

<header>
  <h1>Prüfungsvorbereitung — Buchhaltung · Steuerrecht · Kostenrechnung</h1>
</header>

<div class="container">
  <div class="scorebar">
    <div class="score-main">
      <div>
        <div class="score-num" id="scoreNum">0 / 0</div>
        <div class="score-label">Punkte gesamt</div>
      </div>
      <div class="progress-outer"><div class="progress-inner" id="progressInner"></div></div>
    </div>
    <button class="reset-btn" id="resetBtn">Fortschritt zurücksetzen</button>
  </div>

  <nav class="tabs" id="tabsNav"></nav>

  <div id="sectionsRoot"></div>

  <footer class="foot">بالتوفيق في الامتحان! 🍀 راجع كل قسم وتأكد من فهم الإجابات المفتوحة أيضاً</footer>
</div>

<script>
const DATA = [
  {
    id: "buch1",

    questions: [
      {
        type: "single", points: 1,

          "Das Aufstellen des Inventars durch körperliche Bestandsaufnahme steht im Belieben des Unternehmens, die Bilanz muss lt. Gesetz erstellt werden",
          "Das Inventar ist eine verkürzte Darstellung der in T-Konto-Form aufgestellten Bilanz; die einzelnen Positionen werden hintereinander aufgeführt und das Reinvermögen durch Saldierung des Vermögens und der Schulden festgestellt"
        ],
        correct: [0]
      },
      {
        type: "single", points: 1,
        text: "Wie werden Einnahmen, die vor dem Bilanzstichtag eingehen, aber Erträge für das kommende Jahr darstellen, in der Bilanz ausgewiesen?",
        options: [
          "Als sonstige Forderungen",

          "Als Rückstellungen",
          "Als Rücklagen"
        ],
        correct: [3]
      },
      {
        type: "single", points: 1,
        text: "Wenn der Anfangsbestand auf dem Konto im Haben steht, handelt es sich um ein:",
        options: ["Passives Bestandskonto", "Aufwandskonto", "Aktives Bestandskonto", "Ertragskonto"],
        correct: [0]
      },
      {
        type: "single", points: 1,
        text: "Welcher Posten gehört zum Umlaufvermögen?",
        options: [
          "Betriebs- und Geschäftsausstattung",
          "Die Vorräte an Roh-, Hilfs-, Betriebsstoffen",
          "Der betriebliche Lkw/Pkw",
          "Das Eigenkapital",
          "Die Bankschulden"
        ],
        correct: [1]
      },
      {
        type: "single", points: 1,
        text: "Welche Wirkung hat eine aktive Rechnungsabgrenzung auf den Aufwand?",
        options: [

          "Der Aufwand der alten Rechnungsperiode bleibt gleich hoch",

  {
    id: "abschr",
    title: "Buchhaltung – Abschreibungsarten",
    questions: [
      { type:"single", points:1, text:"„Der Abschreibungsbetrag wird aus dem Restbuchwert des jeweiligen Jahres ermittelt.“",
        options:["Lineare Abschreibung","Degressive Abschreibung","Abschreibung nach Leistungen"], correct:[1] },
      { type:"single", points:1, text:"„Der Abschreibungsbetrag wird mit jedem Abschreibungsjahr kleiner.“",
        options:["Lineare Abschreibung","Degressive Abschreibung","Abschreibung nach Leistungen"], correct:[1] },
      { type:"single", points:1, text:"„Der Abschreibungsbetrag bleibt Jahr für Jahr konstant.“",
        options:["Lineare Abschreibung","Degressive Abschreibung","Abschreibung nach Leistungen"], correct:[0] },
      { type:"single", points:1, text:"„Würde man diese Abschreibungsart beispielsweise für einen PKW/LKW wählen, müsste ein Fahrtenbuch geführt werden.“",
        options:["Lineare Abschreibung","Degressive Abschreibung","Abschreibung nach Leistungen"], correct:[2] },
      { type:"single", points:1, text:"„Es bleibt ein symbolischer Restbuchwert von einem Euro übrig.“",
        options:["Lineare Abschreibung","Degressive Abschreibung","Abschreibung nach Leistungen"], correct:[0] },
      { type:"single", points:1, text:"„Sie wird bei Anlagegütern mit starker Nutzungsschwankung angewandt.“",
        options:["Lineare Abschreibung","Degressive Abschreibung","Abschreibung nach Leistungen"], correct:[2] },
      { type:"single", points:1, text:"„Der Abschreibungsbetrag ergibt sich aus folgender Formel: Restbuchwert * Abschreibungssatz / 100“",
        options:["Lineare Abschreibung","Degressive Abschreibung","Abschreibung nach Leistungen"], correct:[0] }
    ]
  },
  {
    id: "steuer",
    title: "Steuerrecht – Theorie",
    questions: [
      {
        type: "multi", points: 4,
        text: "Was unterliegt der Umsatzsteuer? (mehrere richtig)",
        options: [
          "Lieferungen und sonstige Leistungen, die ein Unternehmer im Inland gegen Entgelt im Rahmen seines Unternehmens ausführt",
          "Der Eigenverbrauch (z.B. der Unternehmer entnimmt Ware für den Eigenbedarf)",
          "Die Einfuhr von Waren aus dem Drittlandsgebiet (z.B. der Unternehmer importiert Textilien aus Asien, wobei Einfuhrumsatzsteuer fällig wird)",
          "Die Einfuhr von Waren aus der EU (z.B. der Unternehmer importiert Handelswaren aus Deutschland, wobei Einfuhrsteuer fällig wird)",
          "Lieferungen und sonstige Leistungen, die ein Unternehmer im Inland kostenlos im Rahmen seines Unternehmens ausführt"

        correct: [0,1,2,3]
      },
      {
        type: "multi", points: 1,
        text: "Welche zwei Aussagen zum Begriff „Vorsteuerüberhang“ sind richtig?",
        options: [
          "Bei einem Vorsteuerüberhang werden Vorsteuerbeträge, die aus dem vorangegangenen Voranmeldungszeitraum stammen, in den laufenden Voranmeldungszeitraum mit einbezogen",
          "Bei einem Vorsteuerüberhang ist die Summe der Vorsteuerbeträge kleiner als die Summe der Umsatzsteuerbeträge",
          "Bei einem Vorsteuerüberhang ist die Summe der Umsatzsteuerbeträge kleiner als die Summe der Vorsteuerbeträge",
          "Bei einem Vorsteuerüberhang erstattet das Finanzamt die überschüssigen Vorsteuern",
          "Der Vorsteuerüberhang muss am Jahresende durch eine Zahlung an das Finanzamt beglichen werden"
        ],
        correct: [2,3]
      },
      {
        type: "single", points: 1,
        text: "Bei der Aufrechnung der Umsatzsteuerkonten ergibt sich für den laufenden Monat eine Zahllast. Welche Bedeutung hat diese für das Unternehmen?",
        options: [
          "Sie stellt eine Besitzsteuer dar",
          "Sie stellt eine Gewinnsteuer dar",
          "Sie stellt eine Kostensteuer dar",
          "Sie stellt eine Verbrauchsteuer dar",
          "Sie stellt einen durchlaufenden Posten dar"
        ],
        correct: [4]
      },
      {
        type: "open", points: 4,
        text: "Welche zwei Arten von Steuerbefreiungen sind Ihnen bekannt? (Nennen Sie zwei Beispiele pro Art!)",
        answer: "Echte Steuerbefreiungen:\n• Exporte in Drittländer\n\nUnechte Steuerbefreiungen:\n• Versicherungen\n• Ärztliche Leistungen\n• Kleinunternehmer § 19 UStG"
      },
      {
        type: "open", points: 1,
        text: "Wann muss ein Unternehmer nach dem Umsatzsteuergesetz eine Rechnung ausstellen?",
        answer: "Bei Lieferungen und sonstigen Leistungen, die er im Inland gegen Entgelt im Rahmen seines Unternehmens ausführt."
      },
      {
        type: "open", points: 2,
        text: "Was versteht man unter IST-Besteuerung bzw. SOLL-Besteuerung?",
        answer: "Ist-Besteuerung: Die Steuerschuld entsteht erst nach Bezahlung.\nSoll-Besteuerung: Die Steuerschuld entsteht bei der Rechnungserstellung."
      },
      {
        type: "open", points: 3,
        text: "Welche betrieblichen Einkunftsarten sind Ihnen bekannt?",
        answer: "• Einkünfte aus Land- und Forstwirtschaft\n• Einkünfte aus sonstiger selbständiger Arbeit\n• Einkünfte aus Gewerbebetrieb\n• Einkünfte aus nichtselbstständiger Arbeit\n• Einkünfte aus Kapitalvermögen\n• Einkünfte aus Vermietung und Verpachtung\n• Einkünfte (Rente)"
      },
      {
        type: "open", points: 4,
        text: "Welche nicht-betrieblichen Einkünfte sind Ihnen bekannt?",
        answer: "• Einkünfte aus nichtselbstständiger Arbeit\n• Einkünfte aus Kapitalvermögen\n• Einkünfte aus Vermietung und Verpachtung\n• Sonstige Einkünfte gemäß § 29 EStG (z.B. Rente)"
      },
      {
        type: "open", points: 3,
        text: "Welche „steuerbaren Vorgänge“ begründen die Nova-Pflicht?",
        answer: "• Lieferungen von bisher in Österreich nicht zum Verkehr zugelassenen Kraftfahrzeugen\n• Erstmalige Zulassung von Kraftfahrzeugen in Österreich\n• Innergemeinschaftlicher Erwerb von Kraftfahrzeugen"
      },
      {
        type: "open", points: 1,
        text: "Was bedeutet Reverse Charge?",
        answer: "Beim Reverse-Charge-Verfahren zahlt der Empfänger einer Leistung die Umsatzsteuer, nicht der Anbieter."
      }
    ]
  },
  {
    id: "kosten",
    title: "Kostenrechnung – Theorie",
    questions: [
      {
        type: "open", points: 1,
        text: "Was versteht man unter kalkulatorischen Kosten?",
        answer: "Kalkulatorische Kosten dienen Unternehmen dazu, Preiskalkulationen vorzunehmen und die Kostenerfassung genauer darzustellen."
      },
      {
        type: "open", points: 4,
        text: "Nennen Sie vier verschiedene Arten von kalkulatorischen Kosten und beschreiben Sie diese.",
        answer: "Kalkulatorische Zinsen:\nZinsen, die ein Unternehmen erwirtschaftet hätte, wenn es Eigenkapital in den Kapitalmarkt und nicht in die Unternehmensabläufe investiert hätte.\n\nKalkulatorischer Unternehmerlohn:\nFür Gesellschafter der Nichtkapitalgesellschaften wird der kalkulatorische Unternehmerlohn fiktiv als Zusatzkosten angesetzt.\n\nKalkulatorische Abschreibung:\nMuss in der Kostenrechnung vorgenommen werden, damit die tatsächliche Wertminderung des Anlagevermögens erfasst werden kann.\n\nKalkulatorische Wagnisse:\nWerden in der Kostenrechnung erfasst und dienen zur Absicherung von Einzelrisiken, z.B. bei Unfällen, Diebstahl, Brandgefahr, Preisverfall."
      },
      {
        type: "single", points: 1,
        text: "Welcher Posten gehört zu den „kalkulatorischen Kosten“?",
        options: ["Privatverbrauch von Waren","Eingangsfrachten","Ausgangsfrachten","Hypothekenzinsen","Abschreibungen auf Sachanlagen vom Wiederbeschaffungswert"],
        correct: [4]
      },
      {
        type: "single", points: 1,
        text: "Ein wesentlicher Vorgang in der Abgrenzung zwischen Buchführung und Kosten- und Leistungsrechnung ist die Unterscheidung zwischen Aufwendungen und Kosten. Wie nennt man Aufwendungen, die mit einem von der Gewinn- und Verlustrechnung abweichenden Betrag in die Kosten- und Leistungsrechnung eingehen?",
        options: ["Gemeinkosten","Kalkulatorische Kosten","Degressive Kosten","Proportionale Kosten","Progressive Kosten"],
        correct: [1]
      },
      {
        type: "single", points: 1,
        text: "Welche Kosten zählen zu den fixen Kosten?",
        options: ["Benzinkosten des Fuhrparks","Ausgangsfrachten für Warenzustellung","Kosten für die Bewachung des Betriebsgeländes durch den Werkschutz","Energiekosten für elektrische Maschinen","Lohnkosten für Aushilfskräfte im Versand"],
        correct: [2]
      }
    ]
  },
  {
    id: "bep",
    title: "Kostenrechnung – Break-Even-Point",
    questions: [
      {
        type: "open", points: 1,
        text: "Welche Informationen erhalten Sie aus dem Break-Even-Point?",
        answer: "Bezeichnet den Punkt, an dem Einnahmen und Kosten gleich hoch sind."
      },
      {
        type: "diagram", points: 7,
        text: "Benennen Sie die jeweiligen Bestandteile der grafischen Darstellung (a–g):",
        labels: {
          a: "Gesamtkosten",
          b: "Fixkosten",
          c: "Break-even-Point",
          d: "Umsatz",

          f: "Verlustzone (grauer Bereich)",
          g: "Variable Kosten"
        }
      }
    ]

];

// ---------- STATE ----------
const STORAGE_KEY = "examPrepProgress_v1";
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
let state = loadState();

function totalPoints() {
  let t = 0;
  DATA.forEach(sec => sec.questions.forEach(q => t += q.points));
  return t;
}
function earnedPoints() {
  let e = 0;
  Object.keys(state).forEach(k => { if (state[k] && state[k].earned) e += state[k].earned; });
  return e;
}
function updateScorebar() {
  const total = totalPoints();
  const earned = earnedPoints();
  document.getElementById('scoreNum').textContent = earned + " / " + total;
  const answeredCount = Object.keys(state).filter(k => state[k] && state[k].done).length;
  let totalQ = 0; DATA.forEach(sec => totalQ += sec.questions.length);
  const pct = totalQ ? Math.round((answeredCount/totalQ)*100) : 0;
  document.getElementById('progressInner').style.width = pct + "%";
}

// ---------- RENDER ----------
const tabsNav = document.getElementById('tabsNav');
const sectionsRoot = document.getElementById('sectionsRoot');

DATA.forEach((sec, sIdx) => {
  const tabBtn = document.createElement('button');
  tabBtn.textContent = sec.title;
  tabBtn.dataset.idx = sIdx;
  tabBtn.addEventListener('click', () => showSection(sIdx));
  tabsNav.appendChild(tabBtn);

  const secEl = document.createElement('section');
  secEl.className = 'topic';
  secEl.id = 'sec-' + sIdx;

  const header = document.createElement('div');
  header.className = 'topic-header';
  header.innerHTML = `<h2>${sec.title}</h2><span>${sec.questions.length} Fragen</span>`;
  secEl.appendChild(header);

  sec.questions.forEach((q, qIdx) => {
    const qId = sec.id + "_" + qIdx;
    const card = document.createElement('div');
    card.className = 'card';

    if (q.type === 'single' || q.type === 'multi') {
      card.innerHTML = `<div class="qtext">${q.text}<span class="points-badge">${q.points} Pkt${q.points>1?'e':''}</span></div>`;
      const optsWrap = document.createElement('div');
      q.options.forEach((opt, oIdx) => {
        const optEl = document.createElement('div');
        optEl.className = 'option';
        optEl.dataset.oidx = oIdx;
        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
        optEl.innerHTML = `<input type="${inputType}" name="${qId}"><span>${opt}</span>`;
        optEl.addEventListener('click', () => toggleOption(qId, sec, qIdx, optEl, q));
        optsWrap.appendChild(optEl);
      });
      card.appendChild(optsWrap);

      const checkBtn = document.createElement('button');
      checkBtn.className = 'check-btn';
      checkBtn.textContent = 'Prüfen';
      checkBtn.addEventListener('click', () => checkAnswer(qId, sec, qIdx, q, card));
      card.appendChild(checkBtn);

      const fb = document.createElement('div');
      fb.className = 'feedback';
      fb.style.display = 'none';
      card.appendChild(fb);

      card._checkBtn = checkBtn;
      card._fb = fb;

      // restore state
      if (state[qId] && state[qId].done) {
        applyAnswerVisual(card, q, state[qId].selected);
        checkBtn.disabled = true;
        checkBtn.textContent = 'Beantwortet';
        fb.style.display = 'block';
        fb.className = 'feedback ' + (state[qId].correct ? 'ok' : 'bad');
        fb.textContent = state[qId].correct ? `Richtig! (+${q.points} Punkte)` : 'Nicht ganz richtig — richtige Antwort ist markiert.';
      }

    } else if (q.type === 'open') {
      card.innerHTML = `<div class="qtext">${q.text}<span class="points-badge">${q.points} Pkt${q.points>1?'e':''}</span></div>`;
      const revealBtn = document.createElement('button');
      revealBtn.className = 'reveal-btn';
      revealBtn.textContent = 'Antwort anzeigen';
      const ansBox = document.createElement('div');
      ansBox.className = 'answer-box';
      ansBox.textContent = q.answer;
      revealBtn.addEventListener('click', () => {
        const showing = ansBox.classList.toggle('show');
        revealBtn.textContent = showing ? 'Antwort verbergen' : 'Antwort anzeigen';
        if (showing && !(state[qId] && state[qId].done)) {
          state[qId] = { done: true, earned: q.points, correct: true };
          saveState(state);
          updateScorebar();
        }
      });
      card.appendChild(revealBtn);
      card.appendChild(ansBox);
      if (state[qId] && state[qId].done) {
        ansBox.classList.add('show');
        revealBtn.textContent = 'Antwort verbergen';
      }

    } else if (q.type === 'diagram') {
      card.innerHTML = `<div class="qtext">${q.text}<span class="points-badge">${q.points} Pkte</span></div>`;
      const wrap = document.createElement('div');
      wrap.className = 'diagram-wrap';
      wrap.innerHTML = buildDiagramSVG();
      card.appendChild(wrap);

      const legend = document.createElement('div');
      legend.className = 'diagram-legend';
      Object.keys(q.labels).forEach(letter => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `<div class="letter">${letter}</div><div class="val">${q.labels[letter]}</div>`;
        row.addEventListener('click', () => {
          row.classList.toggle('shown');
          checkAllShown();
        });
        legend.appendChild(row);
      });
      card.appendChild(legend);

      function checkAllShown() {
        const rows = legend.querySelectorAll('.row');
        const allShown = Array.from(rows).every(r => r.classList.contains('shown'));
        if (allShown && !(state[qId] && state[qId].done)) {
          state[qId] = { done: true, earned: q.points, correct: true };
          saveState(state);
          updateScorebar();
        }
      }

      if (state[qId] && state[qId].done) {
        legend.querySelectorAll('.row').forEach(r => r.classList.add('shown'));
      }

      // also clicking letters on svg reveals matching legend row
      wrap.querySelectorAll('.letter-badge').forEach(badge => {
        badge.addEventListener('click', () => {
          const l = badge.dataset.letter;
          const row = Array.from(legend.querySelectorAll('.row')).find(r => r.querySelector('.letter').textContent === l);
          if (row) { row.classList.add('shown'); checkAllShown(); }
        });
      });
    }

    secEl.appendChild(card);
  });

  sectionsRoot.appendChild(secEl);
});

function toggleOption(qId, sec, qIdx, optEl, q) {
  if (optEl.closest('.card')._answered) return;
  if (q.type === 'single') {
    optEl.parentElement.querySelectorAll('.option').forEach(o => o.querySelector('input').checked = false);
    optEl.querySelector('input').checked = true;
  } else {
    const inp = optEl.querySelector('input');
    inp.checked = !inp.checked;
  }
}

function checkAnswer(qId, sec, qIdx, q, card) {
  const optsWrap = card.querySelectorAll('.option');
  const selected = [];
  optsWrap.forEach(o => { if (o.querySelector('input').checked) selected.push(parseInt(o.dataset.oidx)); });

  if (selected.length === 0) {
    card._fb.style.display = 'block';
    card._fb.className = 'feedback bad';
    card._fb.textContent = 'Bitte wähle zuerst eine Antwort aus.';
    return;
  }

  const correctSet = q.correct.slice().sort();
  const selSet = selected.slice().sort();
  const isCorrect = JSON.stringify(correctSet) === JSON.stringify(selSet);

  applyAnswerVisual(card, q, selected);

  card._checkBtn.disabled = true;
  card._checkBtn.textContent = 'Beantwortet';
  card._answered = true;
  card.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));

  card._fb.style.display = 'block';
  card._fb.className = 'feedback ' + (isCorrect ? 'ok' : 'bad');
  card._fb.textContent = isCorrect ? `Richtig! (+${q.points} Punkte)` : 'Nicht ganz richtig — richtige Antwort ist grün markiert.';

  state[qId] = { done: true, earned: isCorrect ? q.points : 0, correct: isCorrect, selected: selected };
  saveState(state);
  updateScorebar();
}

function applyAnswerVisual(card, q, selected) {
  card.querySelectorAll('.option').forEach(o => {
    const idx = parseInt(o.dataset.oidx);
    if (q.correct.includes(idx)) o.classList.add('correct');
    else if (selected && selected.includes(idx)) o.classList.add('incorrect');
    o.classList.add('disabled');
    if (selected && selected.includes(idx)) o.querySelector('input').checked = true;
  });
  card._answered = true;
  if (card._checkBtn) { card._checkBtn.disabled = true; card._checkBtn.textContent = 'Beantwortet'; }
}

function buildDiagramSVG() {
  return `

    <line x1="50" y1="300" x2="530" y2="300" stroke="#333" stroke-width="2"/>
    <text x="20" y="25" font-size="11" fill="#555">Gesamtkosten pro Jahr</text>
    <text x="480" y="320" font-size="11" fill="#555">Km Leistung</text>

    <polygon points="50,300 320,300 320,160 50,260" fill="#cfd6e0" opacity="0.6"/>
    <polygon points="320,160 320,300 500,300 500,110" fill="#a9c6ff" opacity="0.5"/>

    <line x1="50" y1="260" x2="500" y2="110" stroke="#1c2130" stroke-width="2.5"/>
    <line x1="50" y1="300" x2="320" y2="300" stroke="#1c2130" stroke-width="2"/>
    <line x1="50" y1="300" x2="500" y2="60" stroke="#1c2130" stroke-width="2.5"/>
    <line x1="320" y1="300" x2="320" y2="160" stroke-dasharray="4,3" stroke="#333"/>
    <line x1="320" y1="160" x2="500" y2="160" stroke-dasharray="4,3" stroke="#333"/>

    <g class="letter-badge" data-letter="a" transform="translate(400,225)"><circle r="13"/><text x="0" y="5" text-anchor="middle">a</text></g>
    <g class="letter-badge" data-letter="b" transform="translate(320,315)"><circle r="13"/><text x="0" y="5" text-anchor="middle">b</text></g>
    <g class="letter-badge" data-letter="c" transform="translate(320,145)"><circle r="13"/><text x="0" y="5" text-anchor="middle">c</text></g>
    <g class="letter-badge" data-letter="d" transform="translate(505,50)"><circle r="13"/><text x="0" y="5" text-anchor="middle">d</text></g>
    <g class="letter-badge" data-letter="e" transform="translate(420,150)"><circle r="13"/><text x="0" y="5" text-anchor="middle">e</text></g>
    <g class="letter-badge" data-letter="f" transform="translate(150,270)"><circle r="13"/><text x="0" y="5" text-anchor="middle">f</text></g>
    <g class="letter-badge" data-letter="g" transform="translate(500,175)"><circle r="13"/><text x="0" y="5" text-anchor="middle">g</text></g>
  </svg>`;
}

function showSection(idx) {
  document.querySelectorAll('section.topic').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + idx).classList.add('active');
  Array.from(tabsNav.children).forEach((b, i) => b.classList.toggle('active', i === idx));
}

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Gesamten Fortschritt wirklich zurücksetzen?')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

showSection(0);
updateScorebar();
</script>
